Name = Fun Plugin
Type = Plugin
Author = kingtnt
Version = 1.0
Platform = win64
Description = "Move and poke your friends for fun on your own server.
Right-click a user for: Random Move, Poke, and Chaos (move + poke at once).
The global plugin menu has Settings... and HARD STOP - stop everything.
Timing supports decimals (e.g. 0.5s), a random letters/numbers poke mode, and an auto-stop limiter."
