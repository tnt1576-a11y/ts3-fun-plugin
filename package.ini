Name = Fun Plugin
Type = Plugin
Author = kingtnt
Version = 2.12
Platform = win64
Description = "Move and poke your friends for fun on your own server.
Right-click a USER: Random Move, Poke, Chaos (move + poke), and Talk-poke (poke them whenever they talk).
Right-click a CHANNEL: do it to everyone in that channel at once.
Settings add: decimal-second timing (down to 0.01s), random letters/numbers poke mode, auto-poke-back when someone pokes you, and an auto-stop limiter.
Make copies of yourself: enter an extra connection count and nickname prefix. Copies join in the background without opening audio devices. Your selected tab is preserved. Remove my copies cancels the queue, disconnects plugin-created copies, and closes their tracked tabs.
Talk Back: stream a live pitched echo of a selected person's voice as a private whisper to them. Uses one extra tab; your microphone pauses until Talk Back is stopped. No phrase recording or replay delay.
Global menu: Make copies of myself..., Remove my copies, Settings..., and HARD STOP - stop everything."
